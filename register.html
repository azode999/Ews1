<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Excellence with a Soul™ | Join Community</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="navbar">
  <div class="container nav-flex">
    <a href="index.html" class="logo">Excellence <span>with a Soul™</span></a>
    <button class="theme-toggle" id="darkmodeToggle">🌞 Light</button>
  </div>
</nav>

<section class="auth-section">
  <div class="auth-container" id="authContainer">
    <h2 id="formTitle">Login</h2>
    <form id="authForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="auth-submit" id="submitBtn">Login</button>
    </form>
    <div id="toggleText" class="toggle-link">Don't have an account? Sign up</div>
    <div id="formMessage" class="form-message"></div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-copyright">© 2025 Excellence with a Soul™ — Pursuing impact in godliness.</div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
